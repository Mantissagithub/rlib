name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Lean release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's|^leanprover/lean4:v||p' lean-toolchain)
          name="lean-${version}-linux.tar.zst"
          release=$(gh api "repos/leanprover/lean4/releases/tags/v${version}")
          asset_id=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<< "$release")
          digest=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$release")
          archive="$RUNNER_TEMP/$name"
          gh api -H 'Accept: application/octet-stream' "repos/leanprover/lean4/releases/assets/$asset_id" > "$archive"
          printf '%s  %s\n' "${digest#sha256:}" "$archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-${version}-linux/bin" >> "$GITHUB_PATH"
      - name: Get required mathlib cache
        run: lake exe cache get Mathlib.Probability.ProbabilityMassFunction.Constructions Mathlib.Probability.ProbabilityMassFunction.Integrals Mathlib.Data.Fin.Tuple.Basic Mathlib.Probability.Kernel.IonescuTulcea.Traj Mathlib.Analysis.SpecificLimits.Normed Mathlib.MeasureTheory.Integral.DominatedConvergence Mathlib.Analysis.Normed.Group.Constructions Mathlib.Analysis.Normed.Field.Basic Mathlib.Topology.MetricSpace.Contracting Mathlib.Data.Finset.Lattice.Fold Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Topology.Order.OrderClosed Mathlib.Data.Fintype.Pigeonhole Mathlib.Probability.Moments.SubGaussian
      - name: Build library and example
        run: lake build
      - name: Audit theorem axioms
        run: python3 scripts/check_axioms.py
      - name: Check optimality example
        run: lake env lean -DwarningAsError=true RlibTest/Optimality.lean
      - name: Check value iteration example
        run: lake env lean -DwarningAsError=true RlibTest/ValueIteration.lean
      - name: Check policy improvement example
        run: lake env lean -DwarningAsError=true RlibTest/PolicyImprovement.lean
      - name: Check policy iteration example
        run: lake env lean -DwarningAsError=true RlibTest/PolicyIteration.lean
      - name: Check finite horizon example
        run: lake env lean -DwarningAsError=true RlibTest/FiniteHorizon.lean
      - name: Check infinite horizon example
        run: lake env lean -DwarningAsError=true RlibTest/InfiniteHorizon.lean
      - name: Check trajectory measure example
        run: lake env lean -DwarningAsError=true RlibTest/TrajectoryMeasure.lean
      - name: Check infinite expectation example
        run: lake env lean -DwarningAsError=true RlibTest/InfiniteExpectation.lean
      - name: Check empirical estimation example
        run: lake env lean -DwarningAsError=true RlibTest/Empirical.lean
      - name: Check empirical concentration example
        run: lake env lean -DwarningAsError=true RlibTest/Concentration.lean
      - name: Check Q-learning update example
        run: lake env lean -DwarningAsError=true RlibTest/QLearning.lean
      - name: Check ordered Bellman Q sweep example
        run: lake env lean -DwarningAsError=true RlibTest/QBellmanSweep.lean
      - name: Check sampled Q update example
        run: lake env lean -DwarningAsError=true RlibTest/QSampling.lean
      - name: Check perturbed Bellman Q sweep example
        run: lake env lean -DwarningAsError=true RlibTest/QPerturbedSweep.lean
      - name: Check decaying recursion example
        run: lake env lean -DwarningAsError=true RlibTest/DecayingRecursion.lean
      - name: Check synchronous Q-learning example
        run: lake env lean -DwarningAsError=true RlibTest/QSynchronous.lean
      - name: Check martingale series example
        run: lake env lean -DwarningAsError=true RlibTest/MartingaleSeries.lean
      - name: Check averaged Q noise example
        run: lake env lean -DwarningAsError=true RlibTest/QNoiseAveraging.lean
      - name: Check almost sure Q-learning convergence example
        run: lake env lean -DwarningAsError=true RlibTest/QLearningConvergence.lean
      - name: Check independent sampling Q-learning example
        run: lake env lean -DwarningAsError=true RlibTest/QLearningSampling.lean
      - name: Check per-entry step size example
